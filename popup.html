<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Sleep</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="container">
    <header>
      <div>
        <h1>Tab Sleep</h1>
        <p>Free memory from inactive tabs</p>
      </div>
      <label class="switch">
        <input type="checkbox" id="enabled">
        <span class="slider"></span>
      </label>
    </header>

    <section class="stats">
      <div class="stat"><strong id="sleepingTabs">0</strong><span>Sleeping</span></div>
      <div class="stat"><strong id="totalTabs">0</strong><span>Total tabs</span></div>
    </section>

    <section class="setting">
      <label for="inactivityMinutes">Sleep inactive tabs after</label>
      <select id="inactivityMinutes">
        <option value="5">5 minutes</option>
        <option value="15">15 minutes</option>
        <option value="30">30 minutes</option>
        <option value="60">1 hour</option>
        <option value="120">2 hours</option>
        <option value="240">4 hours</option>
        <option value="480">8 hours</option>
      </select>
    </section>

    <button id="sleepNow">Sleep inactive tabs now</button>
    <button id="options" class="secondary">Settings</button>
    <div id="status"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
