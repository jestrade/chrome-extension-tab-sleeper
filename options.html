<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tab Sleep Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>Tab Sleep Settings</h1>

    <section class="card">
      <label><input id="enabled" type="checkbox"> Enable automatic sleeping</label>
      <label>Check every <input id="checkIntervalMinutes" type="number" min="1" max="60"> minutes</label>
      <label>Sleep tabs after <input id="inactivityMinutes" type="number" min="1" max="1440"> minutes inactive</label>
    </section>

    <section class="card">
      <h2>Exclusions</h2>
      <label><input id="excludePinned" type="checkbox"> Exclude pinned tabs</label>
      <label><input id="excludePlayingAudio" type="checkbox"> Exclude tabs playing audio</label>
      <label>Excluded domains</label>
      <textarea id="excludedDomains" rows="6" placeholder="gmail.com\nslack.com\nexample.com"></textarea>
    </section>

    <section class="card">
      <h2>Memory pressure</h2>
      <label><input id="memoryPressureEnabled" type="checkbox"> Enable memory pressure mode</label>
      <label>Trigger when available memory is below <input id="memoryPressurePercent" type="number" min="5" max="50">%</label>
      <label>Inactivity threshold during pressure <input id="memoryPressureInactivityMinutes" type="number" min="1" max="120"> minutes</label>
      <p>When available system memory drops below the threshold, Tab Sleep can discard inactive tabs sooner.</p>
    </section>

    <button id="save" class="primary">Save settings</button>
    <span id="status"></span>
  </main>
  <script src="options.js"></script>
</body>
</html>
